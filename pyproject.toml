[tool.poetry]
name        = "osbot_serverless_s3_browser"
version     = "v0.1.1"
description = "OSBot-Serverless-S3-Browser"
authors     = ["Dinis Cruz <dinis.cruz@owasp.org>"]
license     = "Apache 2.0"
readme      = "README.md"
homepage    = "https://github.com/owasp-sbot/OSBot-Serverless-S3-Browser"
repository  = "https://github.com/owasp-sbot/OSBot-Serverless-S3-Browser"

[tool.poetry.dependencies]
python            = "^3.12"
osbot-utils       = "*"
osbot-aws         = "*"
osbot-fast-api    = "*"
memory-fs         = "*"
mgraph-db         = "*"
mangum            = "*"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"